name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (zip stays untouched in the repo)
        run: |
          ZIP="$(find . -maxdepth 1 -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then echo "No .zip file found in repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          GRADLE_FILE="$(find _src -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)"
          if [ -z "$GRADLE_FILE" ]; then echo "settings.gradle(.kts) not found inside zip"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (preinstalled SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors
        if: failure()
        run: |
          echo "=== Kotlin / Gradle errors ==="
          grep -E "^e: |What went wrong|error:|FAILED|Execution failed" -A3 build.log | head -n 120 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PWP-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
